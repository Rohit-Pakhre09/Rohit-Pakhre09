<svg width="960" height="340" viewBox="0 0 960 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skill Galaxy and Project Constellation</title>
  <desc id="desc">Rounded animated skill galaxy with project constellation, nebula drift, and signal pulses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040814"/>
      <stop offset="0.55" stop-color="#0A1734"/>
      <stop offset="1" stop-color="#03060E"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 170) rotate(90) scale(68)">
      <stop offset="0" stop-color="#FFF5CB"/>
      <stop offset="0.46" stop-color="#FFCB61"/>
      <stop offset="1" stop-color="#FF8A2A"/>
    </radialGradient>
    <linearGradient id="ring" x1="120" y1="54" x2="394" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74D8FF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#74D8FF" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#74D8FF" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(664 92) rotate(90) scale(130 190)">
      <stop offset="0" stop-color="#55AFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#55AFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(788 248) rotate(90) scale(120 200)">
      <stop offset="0" stop-color="#9D7CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9D7CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="4" y="4" width="952" height="332" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="960" height="340" fill="url(#bg)"/>

    <ellipse cx="660" cy="92" rx="180" ry="130" fill="url(#nebulaA)">
      <animate attributeName="cx" values="650;672;650" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="788" cy="248" rx="170" ry="120" fill="url(#nebulaB)">
      <animate attributeName="cy" values="248;236;248" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <g opacity="0.8">
      <circle cx="54" cy="36" r="1.2" fill="#D3EBFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="128" cy="72" r="1.3" fill="#D3EBFF"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="198" cy="34" r="1.2" fill="#D3EBFF"/>
      <circle cx="318" cy="64" r="1.1" fill="#D3EBFF"/>
      <circle cx="458" cy="32" r="1.4" fill="#D3EBFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="608" cy="56" r="1.2" fill="#D3EBFF"/>
      <circle cx="748" cy="44" r="1.5" fill="#D3EBFF"/>
      <circle cx="898" cy="72" r="1.2" fill="#D3EBFF"/>
    </g>

    <g filter="url(#soft)" opacity="0.52">
      <ellipse cx="256" cy="170" rx="96" ry="96" fill="#FFB85A" fill-opacity="0.25"/>
      <ellipse cx="256" cy="170" rx="136" ry="136" fill="#FFB85A" fill-opacity="0.1"/>
    </g>

    <g filter="url(#glow)">
      <circle cx="256" cy="170" r="52" fill="url(#core)"/>
    </g>

    <g>
      <ellipse cx="256" cy="170" rx="102" ry="64" stroke="url(#ring)" stroke-width="1.5"/>
      <ellipse cx="256" cy="170" rx="154" ry="96" stroke="url(#ring)" stroke-width="1.5"/>
      <ellipse cx="256" cy="170" rx="218" ry="132" stroke="url(#ring)" stroke-width="1.5"/>
    </g>

    <g fill="#A8C8E8" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="1.2">
      <text x="194" y="70">FRONTEND</text>
      <text x="370" y="128">BACKEND</text>
      <text x="74" y="190">DATABASE</text>
      <text x="230" y="314">DEVOPS</text>
    </g>

    <g filter="url(#soft)">
      <circle r="10" fill="#4EC8FF">
        <animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#orbitA"/></animateMotion>
      </circle>
      <path id="orbitA" d="M154 170 A102 64 0 1 0 358 170 A102 64 0 1 0 154 170" fill="none"/>

      <circle r="12" fill="#44E6B2">
        <animateMotion dur="12s" repeatCount="indefinite" rotate="auto"><mpath href="#orbitB"/></animateMotion>
      </circle>
      <path id="orbitB" d="M102 170 A154 96 0 1 0 410 170 A154 96 0 1 0 102 170" fill="none"/>

      <circle r="9" fill="#949DFF">
        <animateMotion dur="16s" repeatCount="indefinite" rotate="auto"><mpath href="#orbitC"/></animateMotion>
      </circle>
      <path id="orbitC" d="M38 170 A218 132 0 1 0 474 170 A218 132 0 1 0 38 170" fill="none"/>
    </g>

    <g transform="translate(722 176)">
      <circle r="26" fill="none" stroke="#7CCFFF" stroke-opacity="0.42" stroke-width="1.2" stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="18" fill="none" stroke="#9BDEFF" stroke-opacity="0.28" stroke-width="1.1">
        <animate attributeName="r" values="16;19;16" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.74" stroke="#6FD6FF" stroke-width="1.4" stroke-dasharray="4 5" filter="url(#soft)">
      <path d="M594 96L680 120"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.1s" repeatCount="indefinite"/></path>
      <path d="M680 120L760 104"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M680 120L722 176"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.2s" repeatCount="indefinite"/></path>
      <path d="M722 176L812 208"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.6s" repeatCount="indefinite"/></path>
      <path d="M722 176L664 248"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M664 248L774 274"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.8s" repeatCount="indefinite"/></path>
    </g>

    <g fill="#C7E4FF" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="1.1">
      <text x="610" y="90">PORTFOLIO</text>
      <text x="698" y="116">ECOMMERCE</text>
      <text x="778" y="100">CHAT APP</text>
      <text x="740" y="170">DASHBOARD</text>
      <text x="826" y="208">API HUB</text>
      <text x="678" y="246">BLOG CMS</text>
      <text x="790" y="276">AI TOOLS</text>
    </g>

    <g filter="url(#soft)">
      <circle cx="594" cy="96" r="7" fill="#4AC4FF"><animate attributeName="r" values="7;8.2;7" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="120" r="10" fill="#6FE9BC"><animate attributeName="r" values="10;11.2;10" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="104" r="8" fill="#96A0FF"><animate attributeName="r" values="8;9.1;8" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="722" cy="176" r="11" fill="#F3A4FF"><animate attributeName="cy" values="176;172;176" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="812" cy="208" r="9" fill="#66CEFF"><animate attributeName="cx" values="812;816;812" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="664" cy="248" r="9" fill="#66E7C4"><animate attributeName="cy" values="248;244;248" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="774" cy="274" r="8" fill="#FFBA73"><animate attributeName="r" values="8;9.2;8" dur="3.7s" repeatCount="indefinite"/></circle>
    </g>

    <g opacity="0.72" filter="url(#soft)">
      <path d="M518 36L548 36" stroke="#97D8FF" stroke-width="1.3" stroke-linecap="round">
        <animate attributeName="transform" type="translate" values="-20 10;360 180" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="7.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="932" y="30" text-anchor="end" fill="#E8F6FF" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="0.8">ROHIT // SKILL GALAXY</text>
    <text x="932" y="50" text-anchor="end" fill="#99D6EA" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="2">PROJECT CONSTELLATION . ALWAYS EXPANDING</text>
  </g>

  <rect x="4" y="4" width="952" height="332" rx="24" stroke="#74B7E7" stroke-opacity="0.5" stroke-width="1.2"/>
</svg>
