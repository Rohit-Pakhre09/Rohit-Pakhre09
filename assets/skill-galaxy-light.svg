<svg width="960" height="340" viewBox="0 0 960 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skill Galaxy and Project Constellation</title>
  <desc id="desc">Animated skill galaxy orbiting around a core with connected project constellation nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.56" stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#F4F9FF"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 170) rotate(90) scale(68)">
      <stop offset="0" stop-color="#FFF8D6"/>
      <stop offset="0.46" stop-color="#FFD66E"/>
      <stop offset="1" stop-color="#FF9A3A"/>
    </radialGradient>
    <linearGradient id="ring" x1="120" y1="54" x2="394" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67C9FF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#67C9FF" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#67C9FF" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="340" fill="url(#bg)"/>

  <g opacity="0.7">
    <circle cx="54" cy="36" r="1.2" fill="#6D86A7"/>
    <circle cx="128" cy="72" r="1.3" fill="#6D86A7"/>
    <circle cx="198" cy="34" r="1.2" fill="#6D86A7"/>
    <circle cx="318" cy="64" r="1.1" fill="#6D86A7"/>
    <circle cx="458" cy="32" r="1.4" fill="#6D86A7"/>
    <circle cx="608" cy="56" r="1.2" fill="#6D86A7"/>
    <circle cx="748" cy="44" r="1.5" fill="#6D86A7"/>
    <circle cx="898" cy="72" r="1.2" fill="#6D86A7"/>
  </g>

  <g filter="url(#soft)" opacity="0.44">
    <ellipse cx="256" cy="170" rx="96" ry="96" fill="#FFB85A" fill-opacity="0.2"/>
    <ellipse cx="256" cy="170" rx="136" ry="136" fill="#FFB85A" fill-opacity="0.08"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="256" cy="170" r="52" fill="url(#core)"/>
  </g>

  <g>
    <ellipse cx="256" cy="170" rx="102" ry="64" stroke="url(#ring)" stroke-width="1.5"/>
    <ellipse cx="256" cy="170" rx="154" ry="96" stroke="url(#ring)" stroke-width="1.5"/>
    <ellipse cx="256" cy="170" rx="218" ry="132" stroke="url(#ring)" stroke-width="1.5"/>
  </g>

  <g fill="#1A3551" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="1.2">
    <text x="194" y="70">FRONTEND</text>
    <text x="370" y="128">BACKEND</text>
    <text x="74" y="190">DATABASE</text>
    <text x="230" y="314">DEVOPS</text>
  </g>

  <g filter="url(#soft)">
    <circle r="10" fill="#3BB4FF">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbitA"/>
      </animateMotion>
    </circle>
    <path id="orbitA" d="M154 170 A102 64 0 1 0 358 170 A102 64 0 1 0 154 170" fill="none"/>

    <circle r="12" fill="#2ED79E">
      <animateMotion dur="12s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbitB"/>
      </animateMotion>
    </circle>
    <path id="orbitB" d="M102 170 A154 96 0 1 0 410 170 A154 96 0 1 0 102 170" fill="none"/>

    <circle r="9" fill="#8E92FF">
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbitC"/>
      </animateMotion>
    </circle>
    <path id="orbitC" d="M38 170 A218 132 0 1 0 474 170 A218 132 0 1 0 38 170" fill="none"/>
  </g>

  <g opacity="0.6" stroke="#59B8F2" stroke-width="1.4" stroke-dasharray="4 5" filter="url(#soft)">
    <path d="M594 96L680 120">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M680 120L760 104">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M680 120L722 176">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M722 176L812 208">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M722 176L664 248">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M664 248L774 274">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#2D4A66" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="1.1">
    <text x="560" y="90">PORTFOLIO</text>
    <text x="656" y="114">ECOMMERCE</text>
    <text x="764" y="98">CHAT APP</text>
    <text x="730" y="170">DASHBOARD</text>
    <text x="820" y="206">API HUB</text>
    <text x="620" y="244">BLOG CMS</text>
    <text x="782" y="272">AI TOOLS</text>
  </g>

  <g filter="url(#soft)">
    <circle cx="594" cy="96" r="7" fill="#48C0FF">
      <animate attributeName="r" values="7;8.2;7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="120" r="10" fill="#6FDDAC">
      <animate attributeName="r" values="10;11.2;10" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="104" r="8" fill="#8A95FF">
      <animate attributeName="r" values="8;9.1;8" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="722" cy="176" r="11" fill="#F09FFF">
      <animate attributeName="cy" values="176;172;176" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="812" cy="208" r="9" fill="#5AC4FF">
      <animate attributeName="cx" values="812;816;812" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="664" cy="248" r="9" fill="#5FE2BF">
      <animate attributeName="cy" values="248;244;248" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="774" cy="274" r="8" fill="#FFB36A">
      <animate attributeName="r" values="8;9.2;8" dur="3.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="932" y="30" text-anchor="end" fill="#253E59" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="0.8">ROHIT // SKILL GALAXY</text>
  <text x="932" y="50" text-anchor="end" fill="#5D7794" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="2">PROJECT CONSTELLATION . ALWAYS EXPANDING</text>
</svg>
