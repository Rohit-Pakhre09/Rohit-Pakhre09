  <g opacity="0.85" filter="url(#softGlow)">
    <path d="M24 268H936" stroke="#1BCFFF" stroke-opacity="0.32" stroke-width="2"/>
    <path d="M120 280H840" stroke="#F8B84E" stroke-opacity="0.22" stroke-width="1.5"/>
    <use href="#carBlue" x="80" y="262">
