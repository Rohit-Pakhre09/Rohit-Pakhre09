  <text x="48" y="48" fill="#E8FBFF" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="1.2">ROHIT // CODE SKYLINE</text>
  <text x="48" y="72" fill="#9ECFDE" font-family="'Segoe UI', sans-serif" font-size="12" letter-spacing="3.5">BUILDING SYSTEMS . SHIPPING IDEAS . LEARNING DAILY</text>
