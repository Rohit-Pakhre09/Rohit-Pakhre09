  <g filter="url(#softGlow)">
    <use href="#drone" x="80" y="96">
      <animate attributeName="x" values="40;860;40" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y" values="96;82;96;108;96" dur="6s" repeatCount="indefinite"/>
