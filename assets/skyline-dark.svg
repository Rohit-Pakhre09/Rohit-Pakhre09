    <use href="#windowCyan" x="818" y="110"><animate attributeName="opacity" values="1;0.15;1" dur="2.3s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="862" y="176"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="888" y="176"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></use>
  </g>

  <g opacity="0.8" filter="url(#glow)">
    <path d="M248 98L228 0H268L248 98Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="rotate" values="-7 248 98;7 248 98;-7 248 98" dur="6.8s" repeatCount="indefinite"/>
    </path>
    <path d="M506 60L476 0H536L506 60Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="rotate" values="5 506 60;-6 506 60;5 506 60" dur="5.4s" repeatCount="indefinite"/>
    </path>
    <path d="M700 76L676 0H724L700 76Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="rotate" values="-4 700 76;6 700 76;-4 700 76" dur="7.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <rect x="-160" y="88" width="140" height="150" fill="url(#haze)" transform="rotate(8 -160 88)">
      <animate attributeName="x" values="-220;1040" dur="5.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-220" y="110" width="100" height="110" fill="url(#haze)" transform="rotate(6 -220 110)">
      <animate attributeName="x" values="-260;1040" dur="7.1s" repeatCount="indefinite"/>
    </rect>
