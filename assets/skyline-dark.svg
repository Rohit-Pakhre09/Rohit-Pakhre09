<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Balanced developer skyline</title>
  <desc id="desc">A modern animated skyline with subtle drones, moving lights, and softly pulsing windows.</desc>
  <defs>
    <linearGradient id="bg" x1="480" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#10233E"/>
      <stop offset="1" stop-color="#050A13"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E1FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E1FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00E1FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EF6FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8EF6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1627"/>
      <stop offset="1" stop-color="#04080F"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="windowCyan" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#76F3FF" fill-opacity="0.9"/>
    </symbol>
    <symbol id="windowAmber" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#F8B84E" fill-opacity="0.9"/>
    </symbol>
    <symbol id="drone" viewBox="0 0 38 14">
      <rect x="12" y="5" width="14" height="4" rx="2" fill="#D6FCFF"/>
      <circle cx="7" cy="7" r="3.5" fill="#00E1FF" fill-opacity="0.88"/>
      <circle cx="31" cy="7" r="3.5" fill="#00E1FF" fill-opacity="0.88"/>
      <rect x="3" y="6" width="32" height="2" rx="1" fill="#89F3FF"/>
    </symbol>
  </defs>

  <rect width="960" height="320" fill="url(#bg)"/>
  <circle cx="804" cy="70" r="36" fill="#B9EEFF" fill-opacity="0.13"/>
  <circle cx="804" cy="70" r="57" fill="#B9EEFF" fill-opacity="0.05"/>

  <g opacity="0.4" filter="url(#softGlow)">
    <ellipse cx="180" cy="64" rx="86" ry="12" fill="#5CBDE1" fill-opacity="0.12">
      <animate attributeName="cx" values="180;290;180" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="86" rx="110" ry="15" fill="#5CBDE1" fill-opacity="0.1">
      <animate attributeName="cx" values="700;600;700" dur="24s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g opacity="0.8">
    <circle cx="120" cy="56" r="1.5" fill="#E9FBFF"/>
    <circle cx="250" cy="84" r="1.2" fill="#E9FBFF"/>
    <circle cx="345" cy="44" r="1.8" fill="#E9FBFF"/>
    <circle cx="430" cy="67" r="1.3" fill="#E9FBFF"/>
    <circle cx="546" cy="38" r="1.4" fill="#E9FBFF"/>
    <circle cx="662" cy="61" r="1.7" fill="#E9FBFF"/>
    <circle cx="888" cy="48" r="1.6" fill="#E9FBFF"/>
  </g>

  <g opacity="0.42" filter="url(#softGlow)">
    <path d="M20 112C108 78 214 78 298 112C382 146 470 149 550 113C644 70 750 74 938 132" stroke="#1FD8FF" stroke-width="2.2" stroke-linecap="round">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M20 112C108 78 214 78 298 112C382 146 470 149 550 113C644 70 750 74 938 132;M20 118C118 84 226 72 310 106C390 138 486 144 564 112C652 78 760 86 938 128;M20 112C108 78 214 78 298 112C382 146 470 149 550 113C644 70 750 74 938 132"/>
    </path>
  </g>

  <g>
    <rect x="0" y="240" width="960" height="80" fill="url(#ground)"/>
    <rect x="44" y="150" width="72" height="90" rx="3" fill="#09131F"/>
    <rect x="96" y="120" width="58" height="120" rx="3" fill="#0C1828"/>
    <rect x="150" y="172" width="88" height="68" rx="3" fill="#0B1726"/>
    <rect x="218" y="98" width="72" height="142" rx="3" fill="#0D1B2F"/>
    <rect x="282" y="132" width="54" height="108" rx="3" fill="#0C1627"/>
    <rect x="326" y="82" width="94" height="158" rx="3" fill="#0A1A2D"/>
    <rect x="410" y="108" width="62" height="132" rx="3" fill="#10203A"/>
    <rect x="458" y="60" width="100" height="180" rx="3" fill="#0C1B31"/>
    <rect x="544" y="124" width="60" height="116" rx="3" fill="#0B1623"/>
    <rect x="592" y="142" width="76" height="98" rx="3" fill="#0A1420"/>
    <rect x="652" y="76" width="96" height="164" rx="3" fill="#0D1D34"/>
    <rect x="734" y="110" width="54" height="130" rx="3" fill="#0B1726"/>
    <rect x="778" y="94" width="68" height="146" rx="3" fill="#112240"/>
    <rect x="840" y="160" width="76" height="80" rx="3" fill="#0B1726"/>
  </g>

  <g opacity="0.32">
    <rect x="92" y="120" width="3" height="120" fill="#67EBFF"/>
    <rect x="285" y="132" width="2.5" height="108" fill="#67EBFF"/>
    <rect x="507" y="60" width="3" height="180" fill="#67EBFF"/>
    <rect x="697" y="76" width="3" height="164" fill="#67EBFF"/>
    <rect x="811" y="94" width="3" height="146" fill="#67EBFF"/>
  </g>

  <g filter="url(#softGlow)">
    <use href="#windowCyan" x="58" y="164"><animate attributeName="opacity" values="0.25;1;0.4;0.25" dur="3.4s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="78" y="164"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="104" y="136"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.2s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="124" y="136"><animate attributeName="opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="170" y="186"><animate attributeName="opacity" values="0.3;0.9;0.5;0.3" dur="3.1s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="198" y="186"><animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="234" y="114"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.8s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="258" y="114"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="300" y="148"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="342" y="98"><animate attributeName="opacity" values="1;0.35;1" dur="3.5s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="366" y="98"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.6s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="426" y="124"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.7s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="474" y="78"><animate attributeName="opacity" values="1;0.35;1" dur="4.3s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="500" y="78"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.9s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="526" y="78"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.5s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="558" y="140"><animate attributeName="opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="610" y="158"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.4s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="670" y="94"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="696" y="94"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="722" y="94"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="748" y="126"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.6s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="792" y="110"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="818" y="110"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="862" y="176"><animate attributeName="opacity" values="1;0.4;1" dur="3.9s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="888" y="176"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></use>
  </g>

  <g opacity="0.7" filter="url(#glow)">
    <path d="M506 60L480 0H532L506 60Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="rotate" values="4 506 60;-5 506 60;4 506 60" dur="7.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <rect x="-160" y="88" width="140" height="150" fill="url(#haze)" transform="rotate(8 -160 88)">
      <animate attributeName="x" values="-220;1040" dur="8.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#softGlow)">
    <use href="#drone" x="120" y="110" opacity="0.78">
      <animate attributeName="x" values="80;760;80" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="y" values="110;102;110;118;110" dur="8s" repeatCount="indefinite"/>
    </use>
  </g>

  <g opacity="0.72" filter="url(#softGlow)">
    <path d="M24 268H936" stroke="#1BCFFF" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="210" cy="268" r="3.5" fill="#74F0FF">
      <animate attributeName="cx" values="120;840;120" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="268" r="2.8" fill="#F8B84E">
      <animate attributeName="cx" values="860;160;860" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="48" y="48" fill="#E8FBFF" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="1.2">ROHIT // CODE SKYLINE</text>
  <text x="48" y="72" fill="#9ECFDE" font-family="'Segoe UI', sans-serif" font-size="12" letter-spacing="3.5">BUILDING SYSTEMS . SHIPPING IDEAS . LEARNING DAILY</text>
</svg>
