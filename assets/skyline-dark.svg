    <use href="#windowAmber" x="258" y="114"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="300" y="148"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="342" y="98"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></use>
