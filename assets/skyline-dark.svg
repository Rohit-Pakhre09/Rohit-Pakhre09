<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sci-fi coding solar system</title>
  <desc id="desc">A futuristic solar system with glowing planets, orbital rings, satellites, and drifting stars.</desc>
  <defs>
    <linearGradient id="bg" x1="480" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040814"/>
      <stop offset="0.52" stop-color="#0C1730"/>
      <stop offset="1" stop-color="#03060E"/>
    </linearGradient>
    <radialGradient id="sunCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 160) rotate(90) scale(68)">
      <stop offset="0" stop-color="#FFF3B2"/>
      <stop offset="0.42" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#FF7B00"/>
    </radialGradient>
    <radialGradient id="planetBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(1)">
      <stop offset="0" stop-color="#A7F6FF"/>
      <stop offset="1" stop-color="#1AA8FF"/>
    </radialGradient>
    <radialGradient id="planetPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(1)">
      <stop offset="0" stop-color="#FFD0F3"/>
      <stop offset="1" stop-color="#E35BFF"/>
    </radialGradient>
    <radialGradient id="planetMint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(1)">
      <stop offset="0" stop-color="#D4FFE8"/>
      <stop offset="1" stop-color="#16D98A"/>
    </radialGradient>
    <radialGradient id="planetIce" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(1)">
      <stop offset="0" stop-color="#F6FBFF"/>
      <stop offset="1" stop-color="#74B9FF"/>
    </radialGradient>
    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4BE4FF" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#4BE4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4BE4FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="320" fill="url(#bg)"/>

  <g opacity="0.85">
    <circle cx="74" cy="42" r="1.5" fill="#E8F7FF"/>
    <circle cx="126" cy="86" r="1.1" fill="#E8F7FF"/>
    <circle cx="304" cy="44" r="1.6" fill="#E8F7FF"/>
    <circle cx="372" cy="92" r="1.1" fill="#E8F7FF"/>
    <circle cx="516" cy="36" r="1.7" fill="#E8F7FF"/>
    <circle cx="610" cy="78" r="1.3" fill="#E8F7FF"/>
    <circle cx="744" cy="46" r="1.8" fill="#E8F7FF"/>
    <circle cx="874" cy="70" r="1.4" fill="#E8F7FF"/>
    <circle cx="910" cy="38" r="1.2" fill="#E8F7FF"/>
  </g>

  <g filter="url(#softGlow)" opacity="0.45">
    <ellipse cx="220" cy="160" rx="86" ry="86" fill="#FF9D2E" fill-opacity="0.2"/>
    <ellipse cx="220" cy="160" rx="122" ry="122" fill="#FF9D2E" fill-opacity="0.08"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="220" cy="160" r="50" fill="url(#sunCore)"/>
  </g>

  <g opacity="0.9">
    <ellipse cx="220" cy="160" rx="104" ry="62" stroke="url(#ringStroke)" stroke-width="1.5"/>
    <ellipse cx="220" cy="160" rx="162" ry="96" stroke="url(#ringStroke)" stroke-width="1.5"/>
    <ellipse cx="220" cy="160" rx="228" ry="134" stroke="url(#ringStroke)" stroke-width="1.5"/>
    <ellipse cx="220" cy="160" rx="302" ry="176" stroke="url(#ringStroke)" stroke-width="1.5"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="324" cy="160" r="8" fill="#7DE7FF">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbit1"/>
      </animateMotion>
    </circle>
    <path id="orbit1" d="M 116 160 A 104 62 0 1 0 324 160 A 104 62 0 1 0 116 160" fill="none"/>

    <g>
      <circle r="12" fill="#7CF7C4">
        <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit2"/>
        </animateMotion>
      </circle>
      <circle r="18" fill="none" stroke="#8CFFE3" stroke-opacity="0.35" stroke-width="1.4">
        <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit2"/>
        </animateMotion>
      </circle>
    </g>
    <path id="orbit2" d="M 58 160 A 162 96 0 1 0 382 160 A 162 96 0 1 0 58 160" fill="none"/>

    <g>
      <circle r="15" fill="#83B7FF">
        <animateMotion dur="15s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit3"/>
        </animateMotion>
      </circle>
      <circle r="23" fill="none" stroke="#9FCAFF" stroke-opacity="0.45" stroke-width="1.4">
        <animateMotion dur="15s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit3"/>
        </animateMotion>
      </circle>
    </g>
    <path id="orbit3" d="M -8 160 A 228 134 0 1 0 448 160 A 228 134 0 1 0 -8 160" fill="none"/>

    <g>
      <circle r="10" fill="#F18BFF">
        <animateMotion dur="21s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit4"/>
        </animateMotion>
      </circle>
      <ellipse rx="20" ry="7" fill="none" stroke="#F7B1FF" stroke-opacity="0.55" stroke-width="1.2">
        <animateMotion dur="21s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit4"/>
        </animateMotion>
      </ellipse>
    </g>
    <path id="orbit4" d="M -82 160 A 302 176 0 1 0 522 160 A 302 176 0 1 0 -82 160" fill="none"/>
  </g>

  <g transform="translate(580 160)">
    <circle r="32" fill="url(#planetBlue)"/>
    <path d="M-28 0C-12 -6 9 -4 28 6" stroke="#D5FBFF" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
    <path d="M-18 16C-4 10 11 10 24 16" stroke="#0C6FD9" stroke-opacity="0.35" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse rx="58" ry="14" fill="none" stroke="#92F0FF" stroke-opacity="0.65" stroke-width="2.2" transform="rotate(-14)"/>
    <ellipse rx="58" ry="14" fill="none" stroke="#92F0FF" stroke-opacity="0.25" stroke-width="6" transform="rotate(-14)"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0 0 0;360 0 0" dur="28s" repeatCount="indefinite"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="790" cy="96" r="11" fill="#3BE1FF">
      <animate attributeName="r" values="11;12.6;11" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="858" cy="172" r="16" fill="#E56CFF">
      <animate attributeName="cy" values="172;166;172" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="224" r="13" fill="#4AF2B0">
      <animate attributeName="cx" values="720;726;720" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.82" filter="url(#softGlow)">
    <path d="M620 96L690 132" stroke="#7DDFFF" stroke-opacity="0.34" stroke-width="1.2" stroke-dasharray="3 5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M612 186L704 214" stroke="#7DDFFF" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="3 5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M754 106L832 160" stroke="#7DDFFF" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="3 5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(628 104)" filter="url(#softGlow)">
    <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#D8FBFF"/>
    <rect x="-20" y="-1" width="12" height="2" rx="1" fill="#8CF2FF"/>
    <rect x="8" y="-1" width="12" height="2" rx="1" fill="#8CF2FF"/>
    <rect x="-1" y="-12" width="2" height="7" rx="1" fill="#8CF2FF"/>
    <circle cx="0" cy="0" r="1.7" fill="#12DFFF"/>
    <animateTransform attributeName="transform" type="translate" values="628 104;644 96;628 104" dur="7s" repeatCount="indefinite"/>
  </g>

  <g opacity="0.38">
    <path d="M0 286C114 252 210 246 314 274C408 300 518 302 620 276C734 246 828 246 960 284V320H0Z" fill="#081220"/>
    <path d="M0 300C136 270 248 274 338 298C438 324 540 324 646 296C754 268 860 270 960 294V320H0Z" fill="#040912"/>
  </g>

  <text x="48" y="48" fill="#EAF9FF" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="1.2">ROHIT // COSMIC CODE SYSTEM</text>
  <text x="48" y="72" fill="#94D9E8" font-family="'Segoe UI', sans-serif" font-size="12" letter-spacing="3.5">FULL-STACK JOURNEY . ORBITING IDEAS . BUILDING WORLDS</text>
</svg>
