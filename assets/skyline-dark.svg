<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">High-motion developer skyline</title>
  <desc id="desc">A futuristic animated skyline with moving drones, traffic, beams, clouds, and pulsing windows.</desc>
  <defs>
    <linearGradient id="bg" x1="480" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050C16"/>
      <stop offset="0.48" stop-color="#10233E"/>
      <stop offset="1" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E1FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E1FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00E1FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#91F7FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#91F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1728"/>
      <stop offset="1" stop-color="#04080F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="windowCyan" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#76F3FF" fill-opacity="0.95"/>
    </symbol>
    <symbol id="windowAmber" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#F8B84E" fill-opacity="0.92"/>
    </symbol>
    <symbol id="drone" viewBox="0 0 44 16">
      <rect x="14" y="6" width="16" height="4" rx="2" fill="#BFFAFF"/>
      <circle cx="8" cy="8" r="4" fill="#00E1FF" fill-opacity="0.95"/>
      <circle cx="36" cy="8" r="4" fill="#00E1FF" fill-opacity="0.95"/>
      <rect x="3" y="7" width="38" height="2" rx="1" fill="#7DEEFF"/>
    </symbol>
    <symbol id="carBlue" viewBox="0 0 28 10">
      <rect x="2" y="3" width="24" height="4" rx="2" fill="#73F2FF"/>
      <circle cx="7" cy="8" r="1.4" fill="#B3FBFF"/>
      <circle cx="21" cy="8" r="1.4" fill="#B3FBFF"/>
    </symbol>
    <symbol id="carAmber" viewBox="0 0 28 10">
      <rect x="2" y="3" width="24" height="4" rx="2" fill="#F8B84E"/>
      <circle cx="7" cy="8" r="1.4" fill="#FFE1A5"/>
      <circle cx="21" cy="8" r="1.4" fill="#FFE1A5"/>
    </symbol>
  </defs>

  <rect width="960" height="320" fill="url(#bg)"/>
  <circle cx="804" cy="68" r="34" fill="#D6F5FF" fill-opacity="0.18"/>
  <circle cx="804" cy="68" r="56" fill="#D6F5FF" fill-opacity="0.06"/>

