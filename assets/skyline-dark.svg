    <use href="#windowAmber" x="558" y="140"><animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="610" y="158"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="670" y="94"><animate attributeName="opacity" values="1;0.25;1" dur="2.5s" repeatCount="indefinite"/></use>
    <use href="#windowCyan" x="696" y="94"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></use>
    <use href="#windowAmber" x="722" y="94"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></use>
