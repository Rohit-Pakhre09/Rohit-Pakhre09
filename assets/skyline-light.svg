  <g opacity="0.6" filter="url(#glow)">
    <path d="M248 98L228 0H268L248 98Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="rotate" values="-7 248 98;7 248 98;-7 248 98" dur="6.8s" repeatCount="indefinite"/>
    </path>
    <path d="M506 60L476 0H536L506 60Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="rotate" values="5 506 60;-6 506 60;5 506 60" dur="5.4s" repeatCount="indefinite"/>
    </path>
    <path d="M700 76L676 0H724L700 76Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="rotate" values="-4 700 76;6 700 76;-4 700 76" dur="7.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
