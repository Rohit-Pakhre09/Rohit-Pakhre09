<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated developer skyline</title>
  <desc id="desc">A bright futuristic skyline with animated windows and sweeping light.</desc>
  <defs>
    <linearGradient id="bg" x1="480" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="0.58" stop-color="#DDEEFF"/>
      <stop offset="1" stop-color="#F3F7FC"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C7F0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22C7F0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22C7F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7D6E8"/>
      <stop offset="1" stop-color="#B7C8DE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="windowBlue" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#1DA9F0" fill-opacity="0.85"/>
    </symbol>
    <symbol id="windowGold" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#F2A73C" fill-opacity="0.9"/>
    </symbol>
  </defs>
  <rect width="960" height="320" fill="url(#bg)"/>
  <circle cx="800" cy="72" r="38" fill="#FFFFFF" fill-opacity="0.72"/>
