    <rect x="44" y="150" width="72" height="90" rx="3" fill="#6D7E95"/>
    <rect x="96" y="120" width="58" height="120" rx="3" fill="#7788A0"/>
    <rect x="150" y="172" width="88" height="68" rx="3" fill="#768AA2"/>
    <rect x="218" y="98" width="72" height="142" rx="3" fill="#61758F"/>
    <rect x="282" y="132" width="54" height="108" rx="3" fill="#7688A0"/>
