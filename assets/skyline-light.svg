  <text x="48" y="48" fill="#223245" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="1.2">ROHIT // CODE SKYLINE</text>
  <text x="48" y="72" fill="#56748F" font-family="'Segoe UI', sans-serif" font-size="12" letter-spacing="3.5">BUILDING SYSTEMS . SHIPPING IDEAS . LEARNING DAILY</text>
