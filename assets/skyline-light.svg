<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">High-motion developer skyline</title>
  <desc id="desc">A bright futuristic skyline with moving drones, traffic, beams, clouds, and pulsing windows.</desc>
  <defs>
    <linearGradient id="bg" x1="480" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="0.58" stop-color="#DCECFB"/>
      <stop offset="1" stop-color="#F4F8FC"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27B8E8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#27B8E8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#27B8E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76D5F4" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#76D5F4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFDCEC"/>
      <stop offset="1" stop-color="#B9CADF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="windowBlue" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#1DA9F0" fill-opacity="0.9"/>
    </symbol>
    <symbol id="windowGold" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#F2A73C" fill-opacity="0.9"/>
    </symbol>
    <symbol id="drone" viewBox="0 0 44 16">
      <rect x="14" y="6" width="16" height="4" rx="2" fill="#F9FEFF"/>
      <circle cx="8" cy="8" r="4" fill="#27B8E8" fill-opacity="0.9"/>
      <circle cx="36" cy="8" r="4" fill="#27B8E8" fill-opacity="0.9"/>
      <rect x="3" y="7" width="38" height="2" rx="1" fill="#89DCF3"/>
    </symbol>
    <symbol id="carBlue" viewBox="0 0 28 10">
      <rect x="2" y="3" width="24" height="4" rx="2" fill="#27B8E8"/>
      <circle cx="7" cy="8" r="1.4" fill="#D6F7FF"/>
      <circle cx="21" cy="8" r="1.4" fill="#D6F7FF"/>
    </symbol>
    <symbol id="carAmber" viewBox="0 0 28 10">
      <rect x="2" y="3" width="24" height="4" rx="2" fill="#F2A73C"/>
      <circle cx="7" cy="8" r="1.4" fill="#FFF0C7"/>
      <circle cx="21" cy="8" r="1.4" fill="#FFF0C7"/>
    </symbol>
  </defs>

  <rect width="960" height="320" fill="url(#bg)"/>
  <circle cx="804" cy="68" r="36" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="804" cy="68" r="58" fill="#FFFFFF" fill-opacity="0.28"/>

