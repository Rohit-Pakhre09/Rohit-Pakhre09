<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sci-fi coding solar system</title>
  <desc id="desc">A futuristic solar system with glowing planets, orbital rings, satellites, and drifting stars.</desc>
  <defs>
    <linearGradient id="bg" x1="480" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="0.55" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#EDF3FF"/>
    </linearGradient>
    <radialGradient id="sunCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 160) rotate(90) scale(68)">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset="0.42" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#FF8B1F"/>
    </radialGradient>
    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46BFEA" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#46BFEA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#46BFEA" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="320" fill="url(#bg)"/>

  <g opacity="0.72">
    <circle cx="74" cy="42" r="1.5" fill="#6E8AA8"/>
    <circle cx="126" cy="86" r="1.1" fill="#6E8AA8"/>
    <circle cx="304" cy="44" r="1.6" fill="#6E8AA8"/>
    <circle cx="372" cy="92" r="1.1" fill="#6E8AA8"/>
    <circle cx="516" cy="36" r="1.7" fill="#6E8AA8"/>
    <circle cx="610" cy="78" r="1.3" fill="#6E8AA8"/>
    <circle cx="744" cy="46" r="1.8" fill="#6E8AA8"/>
    <circle cx="874" cy="70" r="1.4" fill="#6E8AA8"/>
    <circle cx="910" cy="38" r="1.2" fill="#6E8AA8"/>
  </g>

  <g filter="url(#softGlow)" opacity="0.36">
    <ellipse cx="220" cy="160" rx="86" ry="86" fill="#FFB04D" fill-opacity="0.16"/>
    <ellipse cx="220" cy="160" rx="122" ry="122" fill="#FFB04D" fill-opacity="0.06"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="220" cy="160" r="50" fill="url(#sunCore)"/>
  </g>

  <g opacity="0.82">
    <ellipse cx="220" cy="160" rx="104" ry="62" stroke="url(#ringStroke)" stroke-width="1.5"/>
    <ellipse cx="220" cy="160" rx="162" ry="96" stroke="url(#ringStroke)" stroke-width="1.5"/>
    <ellipse cx="220" cy="160" rx="228" ry="134" stroke="url(#ringStroke)" stroke-width="1.5"/>
    <ellipse cx="220" cy="160" rx="302" ry="176" stroke="url(#ringStroke)" stroke-width="1.5"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="324" cy="160" r="8" fill="#27B8E8">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbit1l"/>
      </animateMotion>
    </circle>
    <path id="orbit1l" d="M 116 160 A 104 62 0 1 0 324 160 A 104 62 0 1 0 116 160" fill="none"/>

    <g>
      <circle r="12" fill="#24CC87">
        <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit2l"/>
        </animateMotion>
      </circle>
      <circle r="18" fill="none" stroke="#6DE9BE" stroke-opacity="0.28" stroke-width="1.4">
        <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit2l"/>
        </animateMotion>
      </circle>
    </g>
    <path id="orbit2l" d="M 58 160 A 162 96 0 1 0 382 160 A 162 96 0 1 0 58 160" fill="none"/>

    <g>
      <circle r="15" fill="#6EA5F5">
        <animateMotion dur="15s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit3l"/>
        </animateMotion>
      </circle>
      <circle r="23" fill="none" stroke="#A9C8FF" stroke-opacity="0.4" stroke-width="1.4">
        <animateMotion dur="15s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit3l"/>
        </animateMotion>
      </circle>
    </g>
    <path id="orbit3l" d="M -8 160 A 228 134 0 1 0 448 160 A 228 134 0 1 0 -8 160" fill="none"/>

    <g>
      <circle r="10" fill="#D86AF2">
        <animateMotion dur="21s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit4l"/>
        </animateMotion>
      </circle>
      <ellipse rx="20" ry="7" fill="none" stroke="#E9A9FF" stroke-opacity="0.46" stroke-width="1.2">
        <animateMotion dur="21s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbit4l"/>
        </animateMotion>
      </ellipse>
    </g>
    <path id="orbit4l" d="M -82 160 A 302 176 0 1 0 522 160 A 302 176 0 1 0 -82 160" fill="none"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="790" cy="96" r="11" fill="#27B8E8">
      <animate attributeName="r" values="11;12.6;11" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="858" cy="172" r="16" fill="#D86AF2">
      <animate attributeName="cy" values="172;166;172" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="224" r="13" fill="#24CC87">
      <animate attributeName="cx" values="720;726;720" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.76" filter="url(#softGlow)">
    <path d="M620 96L690 132" stroke="#58C8EA" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M612 186L704 214" stroke="#58C8EA" stroke-opacity="0.24" stroke-width="1.2" stroke-dasharray="3 5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M754 106L832 160" stroke="#58C8EA" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="3 5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(628 104)" filter="url(#softGlow)">
    <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#F7FDFF"/>
    <rect x="-20" y="-1" width="12" height="2" rx="1" fill="#8FD3EC"/>
    <rect x="8" y="-1" width="12" height="2" rx="1" fill="#8FD3EC"/>
    <rect x="-1" y="-12" width="2" height="7" rx="1" fill="#8FD3EC"/>
    <circle cx="0" cy="0" r="1.7" fill="#27B8E8"/>
    <animateTransform attributeName="transform" type="translate" values="628 104;644 96;628 104" dur="7s" repeatCount="indefinite"/>
  </g>

  <g opacity="0.2">
    <path d="M0 286C114 252 210 246 314 274C408 300 518 302 620 276C734 246 828 246 960 284V320H0Z" fill="#CFE0F6"/>
    <path d="M0 300C136 270 248 274 338 298C438 324 540 324 646 296C754 268 860 270 960 294V320H0Z" fill="#DDEAF9"/>
  </g>

  <text x="952" y="34" text-anchor="end" fill="#223245" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="0.6">ROHIT // COSMIC CODE SYSTEM</text>
  <text x="952" y="54" text-anchor="end" fill="#577592" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="2.2">FULL-STACK JOURNEY . ORBITING IDEAS . BUILDING WORLDS</text>
</svg>
