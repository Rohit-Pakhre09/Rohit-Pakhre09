<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Balanced developer skyline</title>
  <desc id="desc">A modern animated skyline with subtle drones, moving lights, softly pulsing windows, and maintenance robots.</desc>
  <defs>
    <linearGradient id="bg" x1="480" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="0.58" stop-color="#DDEEFF"/>
      <stop offset="1" stop-color="#F3F7FC"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C7F0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22C7F0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22C7F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76D5F4" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#76D5F4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7D6E8"/>
      <stop offset="1" stop-color="#B7C8DE"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="windowBlue" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#1DA9F0" fill-opacity="0.88"/>
    </symbol>
    <symbol id="windowGold" viewBox="0 0 10 14">
      <rect x="1" y="1" width="8" height="12" rx="1.3" fill="#F2A73C" fill-opacity="0.88"/>
    </symbol>
    <symbol id="drone" viewBox="0 0 38 14">
      <rect x="12" y="5" width="14" height="4" rx="2" fill="#FAFEFF"/>
      <circle cx="7" cy="7" r="3.5" fill="#27B8E8" fill-opacity="0.84"/>
      <circle cx="31" cy="7" r="3.5" fill="#27B8E8" fill-opacity="0.84"/>
      <rect x="3" y="6" width="32" height="2" rx="1" fill="#88D9F1"/>
    </symbol>
    <symbol id="robot" viewBox="0 0 44 34">
      <rect x="14" y="9" width="16" height="12" rx="4" fill="#F4FEFF"/>
      <circle cx="19" cy="15" r="1.8" fill="#27B8E8"/>
      <circle cx="25" cy="15" r="1.8" fill="#27B8E8"/>
      <rect x="19" y="4" width="2" height="5" rx="1" fill="#89DCF3"/>
      <circle cx="20" cy="3" r="2" fill="#F2A73C"/>
      <rect x="17" y="21" width="2.4" height="8" rx="1.2" fill="#9EE8F8"/>
      <rect x="24.6" y="21" width="2.4" height="8" rx="1.2" fill="#9EE8F8"/>
      <rect x="10" y="11" width="5" height="2.4" rx="1.2" fill="#9EE8F8"/>
      <rect x="29" y="11" width="5" height="2.4" rx="1.2" fill="#9EE8F8"/>
    </symbol>
    <symbol id="toolArm" viewBox="0 0 24 24">
      <path d="M4 20L11 13L14 16L7 23Z" fill="#F2A73C"/>
      <rect x="12" y="9" width="8" height="4" rx="2" transform="rotate(45 12 9)" fill="#A4E7F7"/>
    </symbol>
    <symbol id="dataCube" viewBox="0 0 18 18">
      <rect x="3" y="3" width="12" height="12" rx="2" fill="#27B8E8" fill-opacity="0.82"/>
    </symbol>
  </defs>

  <rect width="960" height="320" fill="url(#bg)"/>
  <circle cx="800" cy="72" r="38" fill="#FFFFFF" fill-opacity="0.72"/>
  <circle cx="800" cy="72" r="56" fill="#FFFFFF" fill-opacity="0.3"/>

  <g opacity="0.34" filter="url(#softGlow)">
    <ellipse cx="180" cy="64" rx="86" ry="12" fill="#7CBBD8" fill-opacity="0.12">
      <animate attributeName="cx" values="180;290;180" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="86" rx="110" ry="15" fill="#7CBBD8" fill-opacity="0.1">
      <animate attributeName="cx" values="700;600;700" dur="24s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g opacity="0.65">
    <circle cx="120" cy="56" r="1.5" fill="#8FB4D5"/>
    <circle cx="250" cy="84" r="1.2" fill="#8FB4D5"/>
    <circle cx="345" cy="44" r="1.8" fill="#8FB4D5"/>
    <circle cx="430" cy="67" r="1.3" fill="#8FB4D5"/>
    <circle cx="546" cy="38" r="1.4" fill="#8FB4D5"/>
    <circle cx="662" cy="61" r="1.7" fill="#8FB4D5"/>
    <circle cx="888" cy="48" r="1.6" fill="#8FB4D5"/>
  </g>

  <g opacity="0.38" filter="url(#softGlow)">
    <path d="M20 112C108 78 214 78 298 112C382 146 470 149 550 113C644 70 750 74 938 132" stroke="#27B8E8" stroke-width="2.2" stroke-linecap="round">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M20 112C108 78 214 78 298 112C382 146 470 149 550 113C644 70 750 74 938 132;M20 118C118 84 226 72 310 106C390 138 486 144 564 112C652 78 760 86 938 128;M20 112C108 78 214 78 298 112C382 146 470 149 550 113C644 70 750 74 938 132"/>
    </path>
  </g>

  <g>
    <rect x="0" y="240" width="960" height="80" fill="url(#ground)"/>
    <rect x="44" y="150" width="72" height="90" rx="3" fill="#677A93"/>
    <rect x="96" y="120" width="58" height="120" rx="3" fill="#6E809A"/>
    <rect x="150" y="172" width="88" height="68" rx="3" fill="#72839A"/>
    <rect x="218" y="98" width="72" height="142" rx="3" fill="#5D718D"/>
    <rect x="282" y="132" width="54" height="108" rx="3" fill="#7688A0"/>
    <rect x="326" y="82" width="94" height="158" rx="3" fill="#61778F"/>
    <rect x="410" y="108" width="62" height="132" rx="3" fill="#8798AE"/>
    <rect x="458" y="60" width="100" height="180" rx="3" fill="#5D7391"/>
    <rect x="544" y="124" width="60" height="116" rx="3" fill="#6F8198"/>
    <rect x="592" y="142" width="76" height="98" rx="3" fill="#7E90A5"/>
    <rect x="652" y="76" width="96" height="164" rx="3" fill="#62788F"/>
    <rect x="734" y="110" width="54" height="130" rx="3" fill="#71849D"/>
    <rect x="778" y="94" width="68" height="146" rx="3" fill="#8091A7"/>
    <rect x="840" y="160" width="76" height="80" rx="3" fill="#71849A"/>
  </g>

  <g opacity="0.28">
    <rect x="92" y="120" width="3" height="120" fill="#2CB8E8"/>
    <rect x="285" y="132" width="2.5" height="108" fill="#2CB8E8"/>
    <rect x="507" y="60" width="3" height="180" fill="#2CB8E8"/>
    <rect x="697" y="76" width="3" height="164" fill="#2CB8E8"/>
    <rect x="811" y="94" width="3" height="146" fill="#2CB8E8"/>
  </g>

  <g filter="url(#softGlow)">
    <use href="#windowBlue" x="58" y="164"><animate attributeName="opacity" values="0.25;1;0.4;0.25" dur="3.4s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="78" y="164"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="104" y="136"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.2s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="124" y="136"><animate attributeName="opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="170" y="186"><animate attributeName="opacity" values="0.3;0.9;0.5;0.3" dur="3.1s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="198" y="186"><animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="234" y="114"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.8s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="258" y="114"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="300" y="148"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="342" y="98"><animate attributeName="opacity" values="1;0.35;1" dur="3.5s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="366" y="98"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.6s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="426" y="124"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.7s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="474" y="78"><animate attributeName="opacity" values="1;0.35;1" dur="4.3s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="500" y="78"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.9s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="526" y="78"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.5s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="558" y="140"><animate attributeName="opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="610" y="158"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.4s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="670" y="94"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="696" y="94"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="722" y="94"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="748" y="126"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.6s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="792" y="110"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="818" y="110"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></use>
    <use href="#windowGold" x="862" y="176"><animate attributeName="opacity" values="1;0.4;1" dur="3.9s" repeatCount="indefinite"/></use>
    <use href="#windowBlue" x="888" y="176"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></use>
  </g>

  <g opacity="0.58" filter="url(#glow)">
    <path d="M506 60L480 0H532L506 60Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="rotate" values="4 506 60;-5 506 60;4 506 60" dur="7.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <rect x="-160" y="88" width="140" height="150" fill="url(#haze)" transform="rotate(8 -160 88)">
      <animate attributeName="x" values="-220;1040" dur="8.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#softGlow)">
    <use href="#drone" x="120" y="110" opacity="0.7">
      <animate attributeName="x" values="80;760;80" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="y" values="110;102;110;118;110" dur="8s" repeatCount="indefinite"/>
    </use>
  </g>

  <g opacity="0.68" filter="url(#softGlow)">
    <path d="M24 268H936" stroke="#27B8E8" stroke-opacity="0.26" stroke-width="2"/>
  </g>

  <g transform="translate(168 248)" filter="url(#softGlow)">
    <rect x="0" y="20" width="118" height="4" rx="2" fill="#D4E3F2"/>
    <rect x="82" y="8" width="12" height="14" rx="2" fill="#27B8E8" fill-opacity="0.12"/>
    <use href="#dataCube" x="86" y="4">
      <animate attributeName="y" values="4;1;4" dur="3.2s" repeatCount="indefinite"/>
    </use>
    <use href="#robot" x="10" y="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="6.5s" repeatCount="indefinite"/>
    </use>
    <circle cx="29" cy="15" r="2" fill="#27B8E8">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <use href="#robot" x="62" y="2" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="5.2s" repeatCount="indefinite"/>
    </use>
    <use href="#toolArm" x="90" y="10">
      <animateTransform attributeName="transform" type="rotate" values="-18 94 14;12 94 14;-18 94 14" dur="3.8s" repeatCount="indefinite"/>
    </use>
    <path d="M100 13L113 9" stroke="#58C8EA" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="48" y="48" fill="#213042" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="1.2">ROHIT // CODE SKYLINE</text>
  <text x="48" y="72" fill="#53718F" font-family="'Segoe UI', sans-serif" font-size="12" letter-spacing="3.5">BUILDING SYSTEMS . SHIPPING IDEAS . LEARNING DAILY</text>
</svg>
